name: Cypress E2E Pipeline 

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    name: E2E Tests (Chrome)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      
      - name: install
        run: npm install

      
      - name: Run cypress tests
        uses: cypress-io/github-action@v6
        with:
          install: false  
          browser: chrome
          start: npm run cypress:run -- --browser chrome 
