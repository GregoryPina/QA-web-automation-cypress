name: Cypress E2E Pipeline 

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    name: E2E Tests (Chrome)
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install
        run: |
          npm install
          npx cypress install

      - name: Run cypress tests
        run: npx cypress run --browser chrome
